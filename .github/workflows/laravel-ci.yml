name: Laravel CI

on:
  push:
    branches:
      - main
      - automation/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Install, migrate and test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: italian_shoes_pos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://127.0.0.1:8000
      APP_TIMEZONE: Asia/Karachi
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: italian_shoes_pos_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify MySQL connection
        run: php artisan db:show

      - name: Run MySQL migrations and seed reference data
        run: php artisan migrate --force --seed

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Run automated tests
        run: php artisan test
